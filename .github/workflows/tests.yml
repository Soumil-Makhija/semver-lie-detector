name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q semver_lie_detector
      - run: python -m pip install .
      - run: semver-lie --help
      - name: Check installed offline CLI
        shell: bash
        run: |
          set +e
          semver-lie local examples/before examples/after --before-version 1.0.0 --after-version 1.1.0 --output /tmp/semver-report.json
          status=$?
          set -e
          test "$status" = 1
          python -c "import json; r=json.load(open('/tmp/semver-report.json')); assert r['summary']['breaking'] == 3"
